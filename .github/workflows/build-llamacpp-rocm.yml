name: Build Llama.cpp + ROCm
on:
  workflow_dispatch:
    inputs:
      operating_systems:
        description: 'Operating systems to build for (comma-separated: windows,ubuntu)'
        required: false
        default: 'windows,ubuntu'
      gfx_target:
        description: 'AMD GPU targets (comma-separated)'
        required: false
        default: 'gfx1151,gfx1150,gfx117X,gfx120X,gfx110X,gfx103X,gfx90a,gfx908'
      rocm_version:
        description: 'ROCm version to use (e.g., 7.13.0a20260318) or "latest" to auto-detect'
        required: false
        default: 'latest'
      llamacpp_version:
        description: 'Llama.cpp version (e.g., tag, branch, or commit hash) or "latest" for master branch'
        required: false
        default: 'latest'
      create_release:
        description: 'Create a GitHub release after successful build (only applies when every GPU target is built for both windows and ubuntu)'
        required: false
        default: true
        type: boolean

  # Trigger on pushes to pull requests
  pull_request:
    types: [opened, synchronize, reopened]

  # Trigger on a schedule to build nightly releases
  schedule:
    # Runs at 1:00 PM UTC, which is 5:00 AM PST (UTC-8)
    # This is two hours after the ROCm nightly tarball is triggered
    - cron: '0 13 * * *'

env:
  OPERATING_SYSTEMS: ${{ github.event.inputs.operating_systems || 'windows,ubuntu' }}
  GFX_TARGETS: ${{ github.event.inputs.gfx_target || 'gfx1151,gfx1150,gfx117X,gfx120X,gfx110X,gfx103X,gfx90a,gfx908' }}
  ROCM_VERSION: ${{ github.event.inputs.rocm_version || 'latest' }}
  LLAMACPP_VERSION: ${{ github.event.inputs.llamacpp_version || 'latest' }}

jobs:
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      windows_matrix: ${{ steps.set-matrix.outputs.windows_matrix }}
      ubuntu_matrix: ${{ steps.set-matrix.outputs.ubuntu_matrix }}
      should_build_windows: ${{ steps.set-matrix.outputs.should_build_windows }}
      should_build_ubuntu: ${{ steps.set-matrix.outputs.should_build_ubuntu }}
      tier0_matrix: ${{ steps.set-matrix.outputs.tier0_matrix }}
      tier1_matrix: ${{ steps.set-matrix.outputs.tier1_matrix }}
      run_tier1: ${{ steps.set-matrix.outputs.run_tier1 }}
      full_release: ${{ steps.set-matrix.outputs.full_release }}
      rocm_version: ${{ steps.set-matrix.outputs.rocm_version }}
      rocm_newest_nightly: ${{ steps.set-matrix.outputs.rocm_newest_nightly }}
      rocm_held_back_by: ${{ steps.set-matrix.outputs.rocm_held_back_by }}
      llamacpp_sha: ${{ steps.set-matrix.outputs.llamacpp_sha }}
      llamacpp_short: ${{ steps.set-matrix.outputs.llamacpp_short }}
      gfx_targets: ${{ steps.set-matrix.outputs.gfx_targets }}
      operating_systems: ${{ steps.set-matrix.outputs.operating_systems }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Every build leg must compile the same llama.cpp commit against the same ROCm nightly.
    # The family -> gfx target list comes from .github/qualify-rocm/families.py.
    - name: Pin llama.cpp and ROCm, and set the matrices
      id: set-matrix
      run: >-
        python3 .github/qualify-rocm/resolve_build_inputs.py
        --gfx-targets "$GFX_TARGETS"
        --operating-systems "$OPERATING_SYSTEMS"
        --rocm-version "$ROCM_VERSION"
        --llamacpp-version "$LLAMACPP_VERSION"

  # ---------------------------------------------------------------------------
  # Alert when the newest ROCm nightly was not yet published for some family, so the run fell back to an older one.
  # Scheduled and manual runs only; pull requests never alert. Only "latest" can fall back: a pinned version is used as given.
  # Comments on the open rocm-fallback issue if there is one, otherwise opens one. Nothing happens on a run without a fallback.
  # ---------------------------------------------------------------------------
  rocm-fallback-alert:
    needs: prepare-matrix
    if: >-
      needs.prepare-matrix.outputs.rocm_held_back_by != '' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      issues: write
    env:
      ALERT_ASSIGNEES: danielholanda,sreeram-11
      ALERT_LABEL: rocm-fallback
    steps:
    - name: Open or update the ROCm fallback issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EVENT: ${{ github.event_name }}
        ROCM_NEWEST_NIGHTLY: ${{ needs.prepare-matrix.outputs.rocm_newest_nightly }}
        ROCM_VERSION: ${{ needs.prepare-matrix.outputs.rocm_version }}
        ROCM_HELD_BACK_BY: ${{ needs.prepare-matrix.outputs.rocm_held_back_by }}
      run: |
        held_back="${ROCM_HELD_BACK_BY//,/, }"
        body=$(cat <<EOF
        The newest ROCm nightly was not yet published for every gfx family, so this run fell back to an older one.

        | | |
        |---|---|
        | Newest ROCm nightly | \`$ROCM_NEWEST_NIGHTLY\` |
        | ROCm nightly used | \`$ROCM_VERSION\` |
        | Held back by | $held_back |
        | Run | $RUN_URL ($EVENT, $(date -u '+%Y-%m-%d %H:%M UTC')) |
        EOF
        )

        gh label create "$ALERT_LABEL" --color FBCA04 \
          --description "A run fell back to an older ROCm nightly" --force

        existing=$(gh issue list --label "$ALERT_LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
        if [ -n "$existing" ]; then
          echo "Commenting on existing issue #$existing"
          gh issue comment "$existing" --body "$body"
        else
          echo "Opening new issue"
          gh issue create \
            --title "ROCm nightly fallback: $ROCM_NEWEST_NIGHTLY not yet published for $held_back" \
            --label "$ALERT_LABEL" \
            --assignee "$ALERT_ASSIGNEES" \
            --body "$body

        Close this issue once TheRock publishes the newest nightly for every family. Further fallbacks while it is open are added as comments."
        fi

  build-windows:
    # Pinned to windows-2022 (VS 2022 / MSVC 14.4x). The windows-latest image moved to
    # VS 2026 (MSVC 14.51) on 2026-06-08, whose <cmath> declares isgreater/isless/etc. as
    # constexpr (implicitly __host__ __device__), which collides with ROCm clang's
    # __device__-only HIP math wrappers and breaks the HIP build. See llama.cpp#22570.
    runs-on: windows-2022
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.should_build_windows == 'true'
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.windows_matrix)}}
      fail-fast: false
    env:
      PINNED_ROCM_VERSION: ${{ needs.prepare-matrix.outputs.rocm_version }}
      PINNED_LLAMACPP_SHA: ${{ needs.prepare-matrix.outputs.llamacpp_sha }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Clean up existing directories (safety precaution)
      run: |
        # Remove existing llama.cpp directory if it exists
        if (Test-Path "llama.cpp") {
          Write-Host "Removing existing llama.cpp directory..."
          Remove-Item -Recurse -Force "llama.cpp"
        }
        
        # Remove existing C:\opt\rocm directory if it exists
        if (Test-Path "C:\opt\rocm") {
          Write-Host "Removing existing C:\opt\rocm directory..."
          Remove-Item -Recurse -Force "C:\opt\rocm"
        }
        
        # Remove any existing ROCm tarball
        if (Test-Path "rocm.tar.gz") {
          Write-Host "Removing existing rocm.tar.gz..."
          Remove-Item -Force "rocm.tar.gz"
        }
        
        Write-Host "Cleanup completed successfully"

    - name: Install Visual Studio Build Tools
      run: |
        # Download and install Visual Studio Build Tools
        $vsInstallerUrl = "https://aka.ms/vs/17/release/vs_buildtools.exe"
        $vsInstallerPath = "$env:TEMP\vs_buildtools.exe"
        
        Write-Host "Downloading Visual Studio Build Tools..."
        . .github/scripts/Invoke-Download.ps1
        Invoke-Download -Uri $vsInstallerUrl -OutFile $vsInstallerPath
        
        Write-Host "Installing Visual Studio Build Tools..."
        Start-Process -FilePath $vsInstallerPath -ArgumentList "--quiet", "--wait", "--norestart", "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "--add", "Microsoft.VisualStudio.Component.VC.CMake.Project", "--add", "Microsoft.VisualStudio.Component.VC.ATL", "--add", "Microsoft.VisualStudio.Component.Windows11SDK.22621" -Wait
        
        # Clean up installer
        Remove-Item $vsInstallerPath -Force

    - name: Install build dependencies
      run: |
        Write-Host "Installing build dependencies using manual methods..."
        . .github/scripts/Invoke-Download.ps1

        # Install Ninja
        Write-Host "Installing Ninja..."
        $ninjaUrl = "https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip"
        $ninjaPath = "$env:TEMP\ninja-win.zip"
        $ninjaDir = "C:\ninja"
        New-Item -ItemType Directory -Force -Path $ninjaDir
        Invoke-Download -Uri $ninjaUrl -OutFile $ninjaPath
        Expand-Archive -Path $ninjaPath -DestinationPath $ninjaDir -Force

        # Install Strawberry Perl, unless the runner already has it.
        if (Test-Path "C:\Strawberry\perl\bin\perl.exe") {
          Write-Host "Strawberry Perl is already installed; skipping the download."
        } else {
          Write-Host "Installing Strawberry Perl..."
          $perlUrl = "http://strawberryperl.com/download/5.32.1.1/strawberry-perl-5.32.1.1-64bit.msi"
          $perlPath = "$env:TEMP\strawberry-perl-5.32.1.1-64bit.msi"
          Invoke-Download -Uri $perlUrl -OutFile $perlPath
          Start-Process msiexec.exe -ArgumentList "/i $perlPath /quiet /norestart" -Wait
        }

        # Verify installations
        $env:PATH = "C:\ninja;C:\Strawberry\perl\bin;$env:PATH"
        Write-Host "Verifying installations..."
        ninja --version
        perl --version

        Write-Host "Manual installation of build dependencies completed"
            
    - name: Download ROCm nightly tarball
      run: |
        # The version was pinned once for the whole run in prepare-matrix, so every family is built against the same ROCm nightly.
        $rocmVersion = $env:PINNED_ROCM_VERSION
        $rocmUrl = "https://nightly.repo.amd.com/rocm/core/tarball/therock-dist-windows-${{ matrix.tarball_target }}-$rocmVersion.tar.gz"

        # Store the version for use in other steps
        echo "DETECTED_ROCM_VERSION=$rocmVersion" >> $env:GITHUB_ENV
        
        Write-Host "Downloading ROCm from: $rocmUrl"
        . .github/scripts/Invoke-Download.ps1
        Invoke-Download -Uri $rocmUrl -OutFile "rocm.tar.gz"
        
    - name: Extract ROCm to C:\opt\rocm
      run: |
        # Create directory if it doesn't exist
        New-Item -ItemType Directory -Force -Path "C:\opt\rocm"
        
        # Extract the tarball
        tar -xzf rocm.tar.gz -C C:\opt\rocm --strip-components=1
      
    - name: Clone llama.cpp
      run: |
        # Check out the commit pinned for the whole run in prepare-matrix, with full history so llama.cpp's build number is right.
        $commit = $env:PINNED_LLAMACPP_SHA
        Write-Host "Cloning llama.cpp at $commit with blobless clone"
        for ($attempt = 1; $attempt -le 5; $attempt++) {
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq 5) { throw "git clone failed with exit code $LASTEXITCODE after 5 attempts" }
          Write-Host "git clone failed (attempt $attempt/5); retrying in $(15 * $attempt)s..."
          Remove-Item -Recurse -Force llama.cpp -ErrorAction SilentlyContinue
          Start-Sleep -Seconds (15 * $attempt)
        }
        cd llama.cpp
        git checkout --detach $commit
        if ($LASTEXITCODE -ne 0) { throw "could not check out $commit" }

        # Get commit hash (5 digits) and store it as environment variable
        $commitHash = git rev-parse --short=5 HEAD
        echo "LLAMACPP_COMMIT_HASH=$commitHash" >> $env:GITHUB_ENV
        Write-Host "llama.cpp commit hash (5 digits): $commitHash"
        
        # Show current commit info
        Write-Host "Current llama.cpp commit:"
        git log --oneline -1

    - name: Build Llama.cpp + ROCm
      shell: cmd
      run: |

        REM GPU targets for this family, from .github/qualify-rocm/families.py
        set "current_target=${{ matrix.gfx_target }}"
        echo Input target: %current_target%
        set "mapped_target=${{ matrix.gpu_targets }}"
        echo Mapped target: %mapped_target%

        REM Set up environment variables and PATH
        set HIP_PATH=C:\opt\rocm
        set HIP_PLATFORM=amd
        set PATH=%HIP_PATH%\lib\llvm\bin;%HIP_PATH%\bin;%PATH%

        REM Set up x64 Native Tools Command Prompt environment
        call "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > vs_path.txt
        set /p VS_PATH=<vs_path.txt
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

        REM Create build directory
        cd llama.cpp
        mkdir build
        cd build

        REM Configure the project
        cmake .. -G Ninja ^
          -DCMAKE_C_COMPILER="C:\opt\rocm\lib\llvm\bin\clang.exe" ^
          -DCMAKE_CXX_COMPILER="C:\opt\rocm\lib\llvm\bin\clang++.exe" ^
          -DCMAKE_CXX_FLAGS="-IC:\opt\rocm\include" ^
          -DCMAKE_CROSSCOMPILING=ON ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DGPU_TARGETS="%mapped_target%" ^
          -DBUILD_SHARED_LIBS=ON ^
          -DLLAMA_BUILD_TESTS=OFF ^
          -DGGML_HIP=ON ^
          -DGGML_OPENMP=OFF ^
          -DGGML_CUDA_FORCE_CUBLAS=OFF ^
          -DGGML_RPC=ON ^
          -DGGML_HIP_ROCWMMA_FATTN=OFF ^
          -DLLAMA_BUILD_BORINGSSL=ON ^
          -DGGML_NATIVE=OFF ^
          -DGGML_STATIC=OFF ^
          -DCMAKE_SYSTEM_NAME=Windows

        REM Build the project
        cmake --build . -j %NUMBER_OF_PROCESSORS%
        
    - name: Copy ROCm core DLLs to build directory
      run: |
        $rocmVersion = if ($env:DETECTED_ROCM_VERSION) { $env:DETECTED_ROCM_VERSION } else { $env:ROCM_VERSION }
        $buildBinPath = "llama.cpp\build\bin"
        $rocmBinPath = "C:\opt\rocm\bin"
        
        Write-Host "Copying ROCm core DLL files to build directory..."
        Write-Host "Source: $rocmBinPath"
        Write-Host "Destination: $buildBinPath"
        
        if (Test-Path $rocmBinPath) {
          # Copy files matching patterns and specific names.
          $filesToCopy = @(
            "amdhip64_*.dll",
            "rocm_kpack.dll",
            "amd_comgr*.dll", 
            "libhipblas.dll",
            "rocblas.dll",
            "rocsolver.dll",
            "hipblaslt.dll",
            "libhipblaslt.dll",
            "hipblas.dll",
            "origami.dll",
            "libtensilelite-host.dll"
          )
          
          foreach ($pattern in $filesToCopy) {
            $matchingFiles = Get-ChildItem -Path $rocmBinPath -Name $pattern -ErrorAction SilentlyContinue
            if ($matchingFiles) {
              foreach ($file in $matchingFiles) {
                $sourcePath = Join-Path $rocmBinPath $file
                $destPath = Join-Path $buildBinPath $file
                Copy-Item $sourcePath $destPath
                Write-Host "Copied: $file"
              }
            } else {
              Write-Host "Warning: No files found matching pattern: $pattern"
            }
          }
          
          # Copy the rocblas\library folder and all its contents
          $rocblasLibPath = Join-Path $rocmBinPath "rocblas\library"
          if (Test-Path $rocblasLibPath) {
            Write-Host "Copying rocblas\library folder and all contents..."
            $destRocblasPath = Join-Path $buildBinPath "rocblas\library"
            Copy-Item -Path $rocblasLibPath -Destination $destRocblasPath -Recurse -Force
            Write-Host "Copied: rocblas\library folder with all contents"
            
            # List the contents of the copied rocblas\library folder
            Write-Host "Contents of rocblas\library:"
            Get-ChildItem $destRocblasPath -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Warning: rocblas\library folder not found at: $rocblasLibPath"
          }

          # Copy the hipblaslt\library folder and all its contents
          $hipblasltLibPath = Join-Path $rocmBinPath "hipblaslt\library"
          if (Test-Path $hipblasltLibPath) {
            Write-Host "Copying hipblaslt\library folder and all contents..."
            $destHipblasltPath = Join-Path $buildBinPath "hipblaslt\library"
            Copy-Item -Path $hipblasltLibPath -Destination $destHipblasltPath -Recurse -Force
            Write-Host "Copied: hipblaslt\library folder with all contents"

            # List the contents of the copied hipblaslt\library folder
            Write-Host "Contents of hipblaslt\library:"
            Get-ChildItem $destHipblasltPath -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Warning: rocblas\library folder not found at: $rocblasLibPath"
          }
          
          # Copy the .kpack folder and all its contents
          $kpackPath = Join-Path $rocmBinPath "..\.kpack"
          if (Test-Path $kpackPath) {
            Write-Host "Copying .kpack folder and all contents..."
            $destKpackPath = Join-Path $buildBinPath ".kpack"
            Copy-Item -Path $kpackPath -Destination $destKpackPath -Recurse -Force
            Write-Host "Copied: .kpack folder with all contents"

            # List the contents of the copied .kpack folder
            Write-Host "Contents of .kpack:"
            Get-ChildItem $destKpackPath -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Warning: .kpack folder not found at: $kpackPath"
          }

          Write-Host "ROCm core files successfully copied to build directory"
        } else {
          Write-Error "ROCm bin directory not found: $rocmBinPath"
          exit 1
        }

    # llama.cpp is MIT-licensed, which requires its notice to travel with every copy. Checked by T0.1.
    - name: Add the llama.cpp license
      run: Copy-Item llama.cpp\LICENSE llama.cpp\build\bin\LICENSE

    - name: List build artifacts (including ROCm files)
      run: |
        cd llama.cpp\build\bin
        Write-Host "Final build artifacts (including ROCm core files):"
        Get-ChildItem -Recurse | Format-Table Name, Length, LastWriteTime

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # The zip is created here, once, and every later job -- the checks and the
    # release -- uses these exact bytes. See .github/qualify-rocm/package.py.
    - name: Package release archive
      run: >-
        python .github/qualify-rocm/package.py
        --source-dir llama.cpp/build/bin
        --os windows
        --gfx-target ${{ matrix.gfx_target }}
        --gpu-targets "${{ matrix.gpu_targets }}"
        --rocm-version $env:PINNED_ROCM_VERSION
        --upstream-sha $env:PINNED_LLAMACPP_SHA
        --output-dir dist

    - name: Upload release archive
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: llama-windows-rocm-${{ matrix.gfx_target }}-x64
        path: dist/llama-windows-rocm-${{ matrix.gfx_target }}-x64.zip
        # Already compressed; zipping it again only costs time.
        compression-level: 0
        retention-days: 30

    - name: Upload qualification metadata
      uses: actions/upload-artifact@v4
      with:
        name: qualify-meta-windows-${{ matrix.gfx_target }}
        path: dist/qualify-meta-windows-${{ matrix.gfx_target }}.json
        retention-days: 30

    - name: Create release summary
      run: |
        $summary = @"
        # Llama.cpp + ROCm Build Summary (Windows - ${{ matrix.gfx_target }})
        
        ## Build Configuration
        - **GPU Target**: ${{ matrix.gfx_target }}
        - **ROCm Version**: ${{ env.DETECTED_ROCM_VERSION || env.ROCM_VERSION }}
        - **llama.cpp Commit Hash**: ${{ env.LLAMACPP_COMMIT_HASH }}
        - **Build Type**: Release
        - **Platform**: Windows
        
        ## Build Artifacts
        The compiled binaries are available in the build artifacts.

        "@
        
        Set-Content -Path "build-summary-windows-${{ matrix.gfx_target }}.md" -Value $summary
        
    - name: Upload build summary
      id: upload-summary
      uses: actions/upload-artifact@v4
      with:
        name: build-summary-windows-${{ matrix.gfx_target }}
        path: build-summary-windows-${{ matrix.gfx_target }}.md
        retention-days: 30
        
    - name: Clean up build artifacts and temporary files
      if: always()
      run: |
        Write-Host "Starting cleanup process..."
        
        # Remove ROCm tarball
        if (Test-Path "rocm.tar.gz") {
          Write-Host "Removing rocm.tar.gz..."
          Remove-Item -Force "rocm.tar.gz"
        }
        
        # Remove ROCm installation directory
        if (Test-Path "C:\opt\rocm") {
          Write-Host "Removing C:\opt\rocm directory..."
          Remove-Item -Recurse -Force "C:\opt\rocm"
        }
        # Remove llama.cpp source directory (keeping only the build artifacts)
        if (Test-Path "llama.cpp") {
          Write-Host "Removing llama.cpp source directory..."
          Remove-Item -Recurse -Force "llama.cpp"
        }
        
        # Clean up any temporary build files
        if (Test-Path "build-summary-windows-${{ matrix.gfx_target }}.md") {
          Write-Host "Removing build-summary-windows-${{ matrix.gfx_target }}.md..."
          Remove-Item -Force "build-summary-windows-${{ matrix.gfx_target }}.md"
        }
        
        Write-Host "Cleanup completed successfully"

  build-ubuntu:
    runs-on: ubuntu-22.04
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.should_build_ubuntu == 'true'
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.ubuntu_matrix)}}
      fail-fast: false
    env:
      PINNED_ROCM_VERSION: ${{ needs.prepare-matrix.outputs.rocm_version }}
      PINNED_LLAMACPP_SHA: ${{ needs.prepare-matrix.outputs.llamacpp_sha }}


    steps:
    - name: Free disk space
      # Remove unused runner files to free up disk space
      # Downloaded to a file first so a retried download can never feed a half
      # script to bash. --retry-all-errors also retries connection timeouts.
      run: |
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$RUNNER_TEMP/util_free_space.sh" https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh
        bash "$RUNNER_TEMP/util_free_space.sh"
    
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Clean up existing directories (safety precaution)
      run: |
        # Remove existing llama.cpp directory if it exists
        if [ -d "llama.cpp" ]; then
          echo "Removing existing llama.cpp directory..."
          rm -rf llama.cpp
        fi
        
        # Remove existing /opt/rocm directory if it exists
        if [ -d "/opt/rocm" ]; then
          echo "Removing existing /opt/rocm directory..."
          sudo rm -rf /opt/rocm
        fi
        
        # Remove any existing ROCm tarball
        if [ -f "rocm.tar.gz" ]; then
          echo "Removing existing rocm.tar.gz..."
          rm -f rocm.tar.gz
        fi
        
        echo "Cleanup completed successfully"

    - name: Install build dependencies
      run: |
        echo "Installing build dependencies..."
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y cmake ninja-build unzip curl
        
        # Verify installations
        echo "Verifying installations..."
        cmake --version
        ninja --version
        echo "Build dependencies installation completed"
            
    - name: Download and extract ROCm directly to /opt/rocm
      run: |
        # The version was pinned once for the whole run in prepare-matrix, so every family is built against the same ROCm nightly.
        rocm_version="$PINNED_ROCM_VERSION"
        rocm_url="https://nightly.repo.amd.com/rocm/core/tarball/therock-dist-linux-${{ matrix.tarball_target }}-${rocm_version}.tar.gz"

        # Store the version for use in other steps
        echo "DETECTED_ROCM_VERSION=$rocm_version" >> $GITHUB_ENV
        
        echo "Streaming ROCm from: $rocm_url directly to extraction"

        # Stream download directly into tar extraction (no intermediate file).
        # A stream cannot resume, so a failed attempt -- including a connection
        # timeout -- empties /opt/rocm and starts over.
        set -o pipefail
        for attempt in 1 2 3 4 5; do
          sudo rm -rf /opt/rocm
          sudo mkdir -p /opt/rocm
          if curl -fsSL "$rocm_url" | sudo tar --use-compress-program=gzip -xf - -C /opt/rocm --strip-components=1; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "::error::Could not download and extract $rocm_url after 5 attempts"
            exit 1
          fi
          echo "Download or extraction failed (attempt $attempt/5); retrying in $((15 * attempt))s..."
          sleep $((15 * attempt))
        done
        
    - name: Set ROCm environment variables
      run: |
        echo "Setting ROCm environment variables..."
        
        # Set environment variables for this step and subsequent steps
        echo "HIP_PATH=/opt/rocm" >> $GITHUB_ENV
        echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
        echo "HIP_PLATFORM=amd" >> $GITHUB_ENV
        echo "HIP_CLANG_PATH=/opt/rocm/llvm/bin" >> $GITHUB_ENV
        echo "HIP_INCLUDE_PATH=/opt/rocm/include" >> $GITHUB_ENV
        echo "HIP_LIB_PATH=/opt/rocm/lib" >> $GITHUB_ENV
        echo "HIP_DEVICE_LIB_PATH=/opt/rocm/lib/llvm/amdgcn/bitcode" >> $GITHUB_ENV
        
        # Update PATH
        echo "/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH" >> $GITHUB_PATH
        
        # Set library paths
        echo "LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:/opt/rocm/llvm/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
        echo "LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:${LIBRARY_PATH:-}" >> $GITHUB_ENV
        echo "CPATH=/opt/rocm/include:${CPATH:-}" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/opt/rocm/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
        
        echo "ROCm environment variables set successfully"

        
    - name: Clone llama.cpp
      run: |
        # Check out the commit pinned for the whole run in prepare-matrix, with full history so llama.cpp's build number is right.
        commit="$PINNED_LLAMACPP_SHA"
        echo "Cloning llama.cpp at $commit with blobless clone"
        for attempt in 1 2 3 4 5; do
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git && break
          if [ "$attempt" -eq 5 ]; then
            echo "::error::git clone failed after 5 attempts"
            exit 1
          fi
          echo "git clone failed (attempt $attempt/5); retrying in $((15 * attempt))s..."
          rm -rf llama.cpp
          sleep $((15 * attempt))
        done
        cd llama.cpp
        git checkout --detach "$commit"
        
        # Get commit hash (5 digits) and store it as environment variable
        commit_hash=$(git rev-parse --short=5 HEAD)
        echo "LLAMACPP_COMMIT_HASH=$commit_hash" >> $GITHUB_ENV
        echo "llama.cpp commit hash (5 digits): $commit_hash"
        
        # Show current commit info
        echo "Current llama.cpp commit:"
        git log --oneline -1

        
    - name: Build Llama.cpp + ROCm
      run: |
        # GPU targets for this family, from .github/qualify-rocm/families.py
        current_target="${{ matrix.gfx_target }}"
        echo "Input target: $current_target"
        mapped_target="${{ matrix.gpu_targets }}"
        echo "Mapped target: $mapped_target"

        # Create build directory
        cd llama.cpp
        mkdir build
        cd build

        # Configure the project
        cmake .. -G Ninja \
          -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang \
          -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
          -DCMAKE_CXX_FLAGS="-I/opt/rocm/include" \
          -DCMAKE_CROSSCOMPILING=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DGPU_TARGETS="$mapped_target" \
          -DBUILD_SHARED_LIBS=ON \
          -DLLAMA_BUILD_TESTS=OFF \
          -DGGML_HIP=ON \
          -DGGML_OPENMP=OFF \
          -DGGML_CUDA_FORCE_CUBLAS=OFF \
          -DGGML_RPC=ON \
          -DGGML_HIP_ROCWMMA_FATTN=OFF \
          -DLLAMA_BUILD_BORINGSSL=ON \
          -DGGML_NATIVE=OFF \
          -DGGML_STATIC=OFF \
          -DCMAKE_SYSTEM_NAME=Linux

        # Build the project
        cmake --build . -j $(nproc)
        
    - name: Copy ROCm core libs to build directory
      run: |
        build_bin_path="llama.cpp/build/bin"
        rocm_bin_path="/opt/rocm/bin"
        
        # Copy the rocblas/library folder and all its contents
        rocblas_lib_path="/opt/rocm/lib/rocblas/library"
        if [ -d "$rocblas_lib_path" ]; then
          echo "Copying rocblas/library folder and all contents..."
          dest_rocblas_path="$build_bin_path/rocblas/library"
          mkdir -p "$(dirname "$dest_rocblas_path")"
          cp -r "$rocblas_lib_path" "$(dirname "$dest_rocblas_path")/"
          echo "Copied: rocblas/library folder with all contents"
          
          # List the contents of the copied rocblas/library folder
          echo "Contents of rocblas/library:"
          find "$dest_rocblas_path" -type f -exec ls -la {} \; | head -20
        else
          echo "Warning: rocblas/library folder not found at: $rocblas_lib_path"
        fi

        # Copy the hipblaslt/library folder and all its contents
        hipblaslt_lib_path="/opt/rocm/lib/hipblaslt/library"
        if [ -d "$hipblaslt_lib_path" ]; then
          echo "Copying hipblaslt/library folder and all contents..."
          dest_hipblaslt_path="$build_bin_path/hipblaslt/library"
          mkdir -p "$(dirname "$dest_hipblaslt_path")"
          cp -r "$hipblaslt_lib_path" "$(dirname "$dest_hipblaslt_path")/"
          echo "Copied: hipblaslt/library folder with all contents"

          # List the contents of the copied hipblaslt/library folder
          echo "Contents of hipblaslt/library:"
          find "$dest_hipblaslt_path" -type f -exec ls -la {} \; | head -20
        else
          echo "Warning: hipblaslt/library folder not found at: $hipblaslt_lib_path"
        fi

        # Copy the .kpack folder and all its contents
        kpack_path="/opt/rocm/.kpack"
        if [ -d "$kpack_path" ]; then
          echo "Copying .kpack folder and all contents..."
          dest_kpack_path="$build_bin_path/.kpack"
          mkdir -p "$(dirname "$dest_kpack_path")"
          cp -r "$kpack_path" "$(dirname "$dest_kpack_path")/"
          echo "Copied: .kpack folder with all contents"

          # List the contents of the copied .kpack folder
          echo "Contents of .kpack:"
          find "$dest_kpack_path" -type f -exec ls -la {} \; | head -20
        else
          echo "Warning: .kpack folder not found at: $kpack_path"
        fi
 
        # Copy required ROCm libraries to build directory
        # If artifacts from ROCm or Llama.cpp change, you may need to update this list
        # To get a new list of all libraries, run:
        # gather_required_libs.py --rocm-dir /opt/rocm --dest-dir llama.cpp/build/bin
        echo "Copying required ROCm libraries to build directory..."
        cp -v /opt/rocm/lib/libhipblas.so* "$build_bin_path/" 2>/dev/null || echo "libhipblas.so* not found"
        cp -v /opt/rocm/lib/librocblas.so* "$build_bin_path/" 2>/dev/null || echo "librocblas.so* not found"
        cp -v /opt/rocm/lib/libamdhip64.so* "$build_bin_path/" 2>/dev/null || echo "libamdhip64.so* not found"
        cp -v /opt/rocm/lib/librocsolver.so* "$build_bin_path/" 2>/dev/null || echo "librocsolver.so* not found"
        cp -v /opt/rocm/lib/libroctx64.so* "$build_bin_path/" 2>/dev/null || echo "libroctx64.so* not found"
        cp -v /opt/rocm/lib/libhipblaslt.so* "$build_bin_path/" 2>/dev/null || echo "libhipblaslt.so* not found"
        cp -v /opt/rocm/lib/libtensilelite-host.so* "$build_bin_path/" 2>/dev/null || echo "libtensilelite-host.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_liblzma.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_liblzma.so* not found"
        cp -v /opt/rocm/lib/librocprofiler-register.so* "$build_bin_path/" 2>/dev/null || echo "librocprofiler-register.so* not found"
        cp -v /opt/rocm/lib/libamd_comgr.so* "$build_bin_path/" 2>/dev/null || echo "libamd_comgr.so* not found"
        cp -v /opt/rocm/lib/libamd_comgr_loader.so* "$build_bin_path/" 2>/dev/null || echo "libamd_comgr_loader.so* not found"
        cp -v /opt/rocm/lib/libhsa-runtime64.so* "$build_bin_path/" 2>/dev/null || echo "libhsa-runtime64.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_numa.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_numa.so* not found"
        cp -v /opt/rocm/lib/librocroller.so* "$build_bin_path/" 2>/dev/null || echo "librocroller.so* not found"
        cp -v /opt/rocm/lib/liborigami.so* "$build_bin_path/" 2>/dev/null || echo "liborigami.so* not found"
        cp -v /opt/rocm/lib/librocm_kpack.so* "$build_bin_path/" 2>/dev/null || echo "librocm_kpack.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_z.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_z.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_zstd.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_zstd.so* not found"
        cp -v /opt/rocm/lib/llvm/lib/libLLVM.so* "$build_bin_path/" 2>/dev/null || echo "libLLVM.so* not found"
        cp -v /opt/rocm/lib/llvm/lib/libclang-cpp.so* "$build_bin_path/" 2>/dev/null || echo "libclang-cpp.so* not found"
        cp -v /opt/rocm/lib/llvm/lib/libomp.so* "$build_bin_path/" 2>/dev/null || echo "libomp.so* not found"
        
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_elf.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_elf.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_drm.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_drm.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_drm_amdgpu.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_drm_amdgpu.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_bz2.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_bz2.so* not found"

        echo "Finished copying required ROCm libraries"

    # llama.cpp is MIT-licensed, which requires its notice to travel with every copy. Checked by T0.1.
    - name: Add the llama.cpp license
      run: cp llama.cpp/LICENSE llama.cpp/build/bin/LICENSE

    - name: Set RPATH for portable distribution
      run: |
        sudo apt-get -o Acquire::Retries=5 install -y patchelf
        cd llama.cpp/build/bin
        # Set RPATH to $ORIGIN so all libraries (including the comgr stub loader) find deps locally.
        # Every ELF file is covered, not just *.so* and llama-*: that narrower pattern missed
        # `llama` and `ggml-rpc-server`, which then shipped with the build machine's paths.
        # A patchelf failure now fails the build instead of being ignored. Checked by T0.7.
        for file in *; do
          [ -f "$file" ] && [ ! -L "$file" ] || continue
          if file "$file" | grep -q 'ELF'; then
            patchelf --set-rpath '$ORIGIN' "$file"
          fi
        done

    - name: List build artifacts (including ROCm files)
      run: |
        cd llama.cpp/build/bin
        echo "Final build artifacts (including ROCm library files):"
        ls -la

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # The zip is created here, once, and every later job -- the checks and the release -- uses these exact bytes.
    # Creating it here also keeps the executables' permission bits, which the artifact upload used to drop.
    # See .github/qualify-rocm/package.py.
    - name: Package release archive
      run: >-
        python .github/qualify-rocm/package.py
        --source-dir llama.cpp/build/bin
        --os ubuntu
        --gfx-target ${{ matrix.gfx_target }}
        --gpu-targets "${{ matrix.gpu_targets }}"
        --rocm-version "$PINNED_ROCM_VERSION"
        --upstream-sha "$PINNED_LLAMACPP_SHA"
        --output-dir dist

    - name: Upload release archive
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: llama-ubuntu-rocm-${{ matrix.gfx_target }}-x64
        path: dist/llama-ubuntu-rocm-${{ matrix.gfx_target }}-x64.zip
        # Already compressed; zipping it again only costs time.
        compression-level: 0
        retention-days: 30

    - name: Upload qualification metadata
      uses: actions/upload-artifact@v4
      with:
        name: qualify-meta-ubuntu-${{ matrix.gfx_target }}
        path: dist/qualify-meta-ubuntu-${{ matrix.gfx_target }}.json
        retention-days: 30

    - name: Create release summary
      run: |
        cat > "build-summary-ubuntu-${{ matrix.gfx_target }}.md" << 'EOF'
        # Llama.cpp + ROCm Build Summary (Ubuntu - ${{ matrix.gfx_target }})
        
        ## Build Configuration
        - **GPU Target**: ${{ matrix.gfx_target }}
        - **ROCm Version**: ${{ env.DETECTED_ROCM_VERSION || env.ROCM_VERSION }}
        - **llama.cpp Commit Hash**: ${{ env.LLAMACPP_COMMIT_HASH }}
        - **Build Type**: Release
        - **Platform**: Ubuntu
        
        ## Build Artifacts
        The compiled binaries are available in the build artifacts.
        EOF
        
    - name: Upload build summary
      id: upload-summary
      uses: actions/upload-artifact@v4
      with:
        name: build-summary-ubuntu-${{ matrix.gfx_target }}
        path: build-summary-ubuntu-${{ matrix.gfx_target }}.md
        retention-days: 30
        
    - name: Clean up build artifacts and temporary files
      if: always()
      run: |
        echo "Starting cleanup process..."
        
        # Remove ROCm tarball
        if [ -f "rocm.tar.gz" ]; then
          echo "Removing rocm.tar.gz..."
          rm -f rocm.tar.gz
        fi
        
        # Remove ROCm installation directory
        if [ -d "/opt/rocm" ]; then
          echo "Removing /opt/rocm directory..."
          sudo rm -rf /opt/rocm
        fi
        
        # Remove llama.cpp source directory (keeping only the build artifacts)
        if [ -d "llama.cpp" ]; then
          echo "Removing llama.cpp source directory..."
          rm -rf llama.cpp
        fi
        
        # Clean up any temporary build files
        if [ -f "build-summary-ubuntu-${{ matrix.gfx_target }}.md" ]; then
          echo "Removing build-summary-ubuntu-${{ matrix.gfx_target }}.md..."
          rm -f "build-summary-ubuntu-${{ matrix.gfx_target }}.md"
        fi
        
        echo "Cleanup completed successfully"

  # ---------------------------------------------------------------------------
  # Release qualification. See .github/qualify-rocm/README.md.
  #
  # Tier 0 is static and runs on hosted runners for every archive, on every
  # trigger including pull requests. Tier 1 runs real inference on the Strix
  # Halo (gfx1151) machines. A gating failure in either fails its job, which is
  # the only signal a pull request gets, and stops create-release from running.
  # ---------------------------------------------------------------------------

  qualify-tier0:
    name: qualify-tier0 (${{ matrix.os }}, ${{ matrix.gfx_target }})
    # !cancelled() rather than always(): every built archive is checked even if
    # another leg failed, so one bad family does not hide findings in the rest.
    if: ${{ !cancelled() && needs.prepare-matrix.result == 'success' }}
    needs: [prepare-matrix, build-windows, build-ubuntu]
    strategy:
      fail-fast: false
      # One leg per archive, on the archive's own operating system, because two of the checks start llama-server from it.
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.tier0_matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Download release archive
      uses: actions/download-artifact@v4
      with:
        name: llama-${{ matrix.os }}-rocm-${{ matrix.gfx_target }}-x64
        path: ./artifact

    - name: Download qualification metadata
      uses: actions/download-artifact@v4
      with:
        name: qualify-meta-${{ matrix.os }}-${{ matrix.gfx_target }}
        path: ./meta

    - name: Run Tier 0 static verification
      run: >-
        python .github/qualify-rocm/tier0_static.py
        --meta meta/qualify-meta-${{ matrix.os }}-${{ matrix.gfx_target }}.json
        --archive-dir ./artifact
        --expected-upstream-sha ${{ needs.prepare-matrix.outputs.llamacpp_sha }}
        --expected-rocm-version ${{ needs.prepare-matrix.outputs.rocm_version }}
        --run-binaries
        --fail-on-error
        --output fragments/tier0-${{ matrix.os }}-${{ matrix.gfx_target }}.json

    - name: Upload Tier 0 report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qualify-fragments-tier0-${{ matrix.os }}-${{ matrix.gfx_target }}
        path: fragments/*.json
        if-no-files-found: warn

  qualify-tier1:
    name: qualify-tier1 (${{ matrix.os }}, ${{ matrix.gfx_target }})
    # Hardware validation on Strix Halo (gfx1151), the one family with test
    # machines. Every other archive's record says it was not run on hardware.
    # Runs on every trigger -- schedule, manual dispatch and pull request --
    # except a pull request from a fork.
    if: >-
      ${{ !cancelled() && needs.prepare-matrix.result == 'success' &&
          needs.prepare-matrix.outputs.run_tier1 == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [prepare-matrix, build-windows, build-ubuntu]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.tier1_matrix) }}
    # AMD DevLab's pool: `devlab-dispatch` opts in to the pool and
    # `strix-halo` narrows it to gfx1151 machines; both are required.
    runs-on: [strix-halo, devlab-dispatch, "${{ matrix.runner_os }}", self-hosted]
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download release archive
      uses: actions/download-artifact@v4
      with:
        name: llama-${{ matrix.os }}-rocm-${{ matrix.gfx_target }}-x64
        path: ./artifact

    - name: Download qualification metadata
      uses: actions/download-artifact@v4
      with:
        name: qualify-meta-${{ matrix.os }}-${{ matrix.gfx_target }}
        path: ./meta

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Pin the interpreter the later steps use.
    # A self-hosted machine may carry a second Python earlier on its search path,
    # and the scripts would then quietly run under that one instead.
    - name: Pin the interpreter
      shell: python
      run: |
        import os
        location = os.environ["pythonLocation"]
        interpreter = (os.path.join(location, "python.exe") if os.name == "nt"
                       else os.path.join(location, "bin", "python"))
        if not os.path.exists(interpreter):
            raise SystemExit(f"::error::no interpreter at {interpreter}")
        print(f"Qualification scripts will run under {interpreter}")
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
            handle.write(f"QUALIFY_PYTHON={interpreter}\n")

    # Unpacking the archive and fetching the test model happen inside the
    # script, so this one command line parses the same under every shell.
    - name: Run Tier 1 GPU inference
      run: >-
        ${{ env.QUALIFY_PYTHON }} .github/qualify-rocm/tier1_gpu.py
        --meta meta/qualify-meta-${{ matrix.os }}-${{ matrix.gfx_target }}.json
        --archive-dir ./artifact
        --gfx-target ${{ matrix.gfx_target }}
        --logs-dir fragments
        --fail-on-error
        --output fragments/tier1-${{ matrix.os }}-${{ matrix.gfx_target }}.json

    - name: Upload Tier 1 report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qualify-fragments-tier1-${{ matrix.os }}-${{ matrix.gfx_target }}
        path: |
          fragments/*.json
          fragments/*.log
        if-no-files-found: warn

    # A cancelled run can leave llama-server alive and holding GPU memory.
    # The script stops it on every path it reaches; this is the backstop for the ones it never gets to.
    # continue-on-error because a red mark here would only add noise on top of whatever already went wrong.
    - name: Tear down
      if: always()
      continue-on-error: true
      shell: python
      run: |
        import subprocess, sys
        cmd = (["taskkill", "/F", "/IM", "llama-server.exe"]
               if sys.platform == "win32" else
               ["pkill", "-f", "llama-server"])
        try:
            subprocess.run(cmd, check=False, capture_output=True, timeout=60)
        except (OSError, subprocess.SubprocessError) as exc:
            print(f"cleanup skipped: {exc}")

  create-release:
    needs: [prepare-matrix, build-windows, build-ubuntu, qualify-tier0, qualify-tier1]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    # All or nothing: every archive must pass its gating checks before anything is published.
    # A manual run only publishes when it built every gfx family in families.py on Windows and Linux.
    # gfx1151 is always part of a manual run, so Tier 1 is never skipped.
    if: |
      always() &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-ubuntu.result == 'success' || needs.build-ubuntu.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-ubuntu.result == 'success') &&
      needs.qualify-tier0.result == 'success' &&
      (needs.qualify-tier1.result == 'success' ||
       (needs.qualify-tier1.result == 'skipped' && needs.prepare-matrix.outputs.run_tier1 != 'true')) &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' &&
       needs.prepare-matrix.outputs.full_release == 'true' &&
       (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == null) ||
       github.event_name == 'schedule')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download release archives
      uses: actions/download-artifact@v4
      with:
        pattern: llama-*-rocm-*-x64
        path: ./artifacts
        merge-multiple: true

    - name: Download qualification metadata
      uses: actions/download-artifact@v4
      with:
        pattern: qualify-meta-*
        path: ./meta
        merge-multiple: true

    - name: Download qualification reports
      uses: actions/download-artifact@v4
      with:
        pattern: qualify-fragments-*
        path: ./fragments
        merge-multiple: true

    - name: Generate release tag
      id: generate-tag
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        # Get all existing release tags that match the pattern b####
        existing_tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -E '^b[0-9]{4}$' | sort -V || echo "")
        
        if [ -z "$existing_tags" ]; then
          # No existing sequential tags found, start with b1000
          next_number=1000
          echo "No existing sequential release tags found, starting with b1000"
        else
          # Find the highest existing number
          highest_tag=$(echo "$existing_tags" | tail -n 1)
          highest_number=$(echo "$highest_tag" | sed 's/^b//')
          next_number=$((highest_number + 1))
          echo "Highest existing tag: $highest_tag (number: $highest_number)"
          echo "Next number will be: $next_number"
        fi
        
        # Format as b#### (4-digit number with leading zeros)
        TAG=$(printf "b%04d" $next_number)
        
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "Generated release tag: ${TAG}"
        
    - name: Check if tag already exists
      id: check-tag
      run: |
        TAG="${{ steps.generate-tag.outputs.tag }}"
        
        # Check if the tag already exists
        if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
          echo "Tag $TAG already exists, skipping release creation"
          echo "tag_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Tag $TAG does not exist, proceeding with release creation"
          echo "tag_exists=false" >> $GITHUB_OUTPUT
        fi
        
    # T0.11: each archive's SHA-256 must match the one its build job recorded,
    # so what ships is byte-for-byte what Tier 0 and Tier 1 checked.
    # Also moves the archives into ./release under their published names.
    - name: Confirm the archives are the ones that were tested
      if: steps.check-tag.outputs.tag_exists == 'false'
      run: >-
        python3 .github/qualify-rocm/check_final.py
        --meta-dir ./meta
        --artifacts-dir ./artifacts
        --release-dir ./release
        --fragments-dir ./fragments
        --tag "${{ steps.generate-tag.outputs.tag }}"

    - name: Qualify the release
      if: steps.check-tag.outputs.tag_exists == 'false'
      env:
        TAG: ${{ steps.generate-tag.outputs.tag }}
        BUILT_TARGETS: ${{ needs.prepare-matrix.outputs.gfx_targets }}
        BUILT_OSES: ${{ needs.prepare-matrix.outputs.operating_systems }}
        RUN_TIER1: ${{ needs.prepare-matrix.outputs.run_tier1 }}
      run: >-
        python3 .github/qualify-rocm/aggregate.py
        --fragments-dir ./fragments
        --tag "$TAG"
        --records-dir ./qualification
        --operating-systems "$BUILT_OSES"
        --gfx-targets "$BUILT_TARGETS"
        --require-tier1 "$RUN_TIER1"
        --fail-on-not-publishable

    - name: Upload qualification records
      if: always() && steps.check-tag.outputs.tag_exists == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: qualification-records
        path: qualification/*.json
        if-no-files-found: warn

    # checksums.txt lets anyone confirm a download is the published file; the
    # qualification-*.json records say what each archive contains, which gfx
    # target was run on hardware, and every check's result.
    - name: Add checksums and qualification records
      if: steps.check-tag.outputs.tag_exists == 'false'
      run: |
        cd release
        sha256sum *.zip > checksums.txt
        cat checksums.txt
        cp -v ../qualification/*.json .

    # A download table (one row per family, a link per OS) followed by the build details.
    # ROCm and llama.cpp were pinned once for the whole run in prepare-matrix, so they describe every archive.
    # Lemonade reads the "Llama.cpp Commit Hash" line; release_notes.py keeps its format.
    - name: Write the release notes
      if: steps.check-tag.outputs.tag_exists == 'false'
      run: >-
        python3 .github/qualify-rocm/release_notes.py
        --repo "${{ github.repository }}"
        --tag "${{ steps.generate-tag.outputs.tag }}"
        --release-dir ./release
        --gfx-targets "${{ needs.prepare-matrix.outputs.gfx_targets }}"
        --operating-systems "${{ needs.prepare-matrix.outputs.operating_systems }}"
        --rocm-version "${{ needs.prepare-matrix.outputs.rocm_version }}"
        --rocm-newest-nightly "${{ needs.prepare-matrix.outputs.rocm_newest_nightly }}"
        --rocm-held-back-by "${{ needs.prepare-matrix.outputs.rocm_held_back_by }}"
        --llamacpp-short "${{ needs.prepare-matrix.outputs.llamacpp_short }}"
        --llamacpp-sha "${{ needs.prepare-matrix.outputs.llamacpp_sha }}"
        --output release-notes.md

    - name: Create Release
      if: steps.check-tag.outputs.tag_exists == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        TAG="${{ steps.generate-tag.outputs.tag }}"
        echo "Creating release with tag: $TAG"

        # Verify archives exist
        ls -la release

        upload_files=$(ls release/*.zip release/checksums.txt release/qualification-*.json)
        echo "Files to upload: $upload_files"

        # Create release with GitHub CLI
        gh release create "$TAG" \
          --title "$TAG" \
          --notes-file release-notes.md \
          $upload_files

  # ---------------------------------------------------------------------------
  # Publish this run's qualification records to the qualification-data branch, where the dashboard polls them.
  # Pass or fail, every archive the run was meant to build gets a row, including an archive whose build failed.
  # The format is described in .github/qualify-rocm/FEED.md.
  # ---------------------------------------------------------------------------
  publish-qualification:
    # Only runs that would create a release: the scheduled nightly, and manual runs with create_release ticked that build every family -- the same runs create-release accepts.
    # Pull requests never publish.
    # Runs whatever create-release did. When a build or a check fails, create-release is skipped and writes no records, so this job writes them itself from the Tier 0 and Tier 1 reports.
    # !cancelled() rather than always(): a run someone cancelled publishes nothing.
    if: >-
      ${{ !cancelled() && needs.prepare-matrix.result == 'success' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            needs.prepare-matrix.outputs.full_release == 'true' &&
            (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == null))) }}
    needs: [prepare-matrix, build-windows, build-ubuntu, qualify-tier0, qualify-tier1, create-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # to push to the qualification-data branch
      actions: read   # to read each build job's result

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Written by create-release when it got as far as qualifying the release.
    - name: Download release qualification records
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: qualification-records
        path: ./records

    - name: Download qualification reports
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: qualify-fragments-*
        path: ./fragments
        merge-multiple: true

    # Without the release job's records, build them from the Tier 0 and Tier 1 reports.
    # No --tag: there is no release, so T0.11 is not required and nothing is marked published.
    - name: Collect qualification records
      id: records
      env:
        BUILT_TARGETS: ${{ needs.prepare-matrix.outputs.gfx_targets }}
        BUILT_OSES: ${{ needs.prepare-matrix.outputs.operating_systems }}
        RUN_TIER1: ${{ needs.prepare-matrix.outputs.run_tier1 }}
        RELEASE_RESULT: ${{ needs.create-release.result }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        records=(records/qualification-llama-*.json)
        if [ ${#records[@]} -gt 0 ]; then
          echo "Using the ${#records[@]} record(s) the release job wrote."
          source=release
        else
          echo "The release job wrote no records (create-release: $RELEASE_RESULT); building them from the Tier 0 and Tier 1 reports."
          rm -rf records
          python3 .github/qualify-rocm/aggregate.py \
            --fragments-dir ./fragments \
            --records-dir ./records \
            --operating-systems "$BUILT_OSES" \
            --gfx-targets "$BUILT_TARGETS" \
            --require-tier1 "$RUN_TIER1"
          source=fallback
        fi
        # The release exists only if create-release finished and these are its records.
        published=false
        if [ "$source" = release ] && [ "$RELEASE_RESULT" = success ]; then
          published=true
        fi
        echo "published=$published" >> "$GITHUB_OUTPUT"
        echo "Published: $published"

    # build_result for every row, and the reason for an archive that has no record.
    - name: Read build job results
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        for attempt in 1 2 3; do
          if gh api --paginate \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | {name, conclusion}' > jobs.jsonl; then
            grep '"name":"build-' jobs.jsonl || true
            exit 0
          fi
          echo "Could not read the run's jobs (attempt $attempt); retrying"
          sleep $((attempt * 5))
        done
        echo "::warning::Could not read the run's jobs; build_result will be 'unknown'."
        : > jobs.jsonl

    - name: Publish to qualification-data branch
      env:
        GH_TOKEN: ${{ github.token }}
        BUILT_TARGETS: ${{ needs.prepare-matrix.outputs.gfx_targets }}
        BUILT_OSES: ${{ needs.prepare-matrix.outputs.operating_systems }}
        ROCM_VERSION: ${{ needs.prepare-matrix.outputs.rocm_version }}
        ROCM_NEWEST_NIGHTLY: ${{ needs.prepare-matrix.outputs.rocm_newest_nightly }}
        ROCM_HELD_BACK_BY: ${{ needs.prepare-matrix.outputs.rocm_held_back_by }}
        LLAMACPP_SHA: ${{ needs.prepare-matrix.outputs.llamacpp_sha }}
        PUBLISHED: ${{ steps.records.outputs.published }}
      run: |
        set -euo pipefail
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        BRANCH="qualification-data"
        TAG=$(python3 -c 'import glob, json; print(next((t for t in (json.load(open(p)).get("build", {}).get("release_tag") for p in sorted(glob.glob("records/qualification-llama-*.json"))) if t), ""))')

        pushed=0
        for attempt in 1 2 3 4 5; do
          rm -rf data
          found=0
          git ls-remote --exit-code --heads "$REPO_URL" "$BRANCH" >/dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            if ! git clone --quiet --depth 1 --branch "$BRANCH" "$REPO_URL" data; then
              echo "Clone failed (attempt $attempt); retrying"; sleep $((attempt * 3)); continue
            fi
          elif [ "$found" -eq 2 ]; then
            echo "$BRANCH does not exist yet; creating it"
            git init --quiet data
            git -C data checkout --quiet --orphan "$BRANCH"
            git -C data remote add origin "$REPO_URL"
          else
            echo "Could not reach the repository (attempt $attempt); retrying"; sleep $((attempt * 3)); continue
          fi

          python3 .github/qualify-rocm/publish_qualification.py \
            --records-dir records \
            --data-dir data/qualification \
            --operating-systems "$BUILT_OSES" \
            --gfx-targets "$BUILT_TARGETS" \
            --jobs-file jobs.jsonl \
            --published "$PUBLISHED" \
            --rocm-version "$ROCM_VERSION" \
            --rocm-newest-nightly "$ROCM_NEWEST_NIGHTLY" \
            --rocm-held-back-by "$ROCM_HELD_BACK_BY" \
            --upstream-sha "$LLAMACPP_SHA"
          # Keep the format description next to the data it describes.
          cp .github/qualify-rocm/FEED.md data/qualification/SCHEMA.md

          git -C data add -A
          if git -C data diff --cached --quiet; then
            echo "Nothing changed; the feed already holds this run."
            pushed=1; break
          fi
          git -C data commit --quiet -m "qualification: run ${{ github.run_id }} (${TAG:-no release})"
          if git -C data push --quiet origin "$BRANCH"; then
            pushed=1; break
          fi
          echo "Push rejected (attempt $attempt), most likely because another run published first; retrying"
          sleep $((attempt * 3))
        done

        [ "$pushed" = 1 ] || { echo "::error::Could not publish to $BRANCH after 5 attempts."; exit 1; }
        echo "Feed: https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/qualification/index.json"
