name: Test Llama.cpp + ROCm
# Re-qualifies an already-published release with the same checks the nightly
# runs: Tier 0 on every chosen archive, exactly as users download it, and Tier 1
# on the Strix Halo machines for the gfx1151 archives.
# See .github/qualify-rocm/README.md for what each check does.
on:
  workflow_dispatch:
    inputs:
      operating_systems:
        description: 'Operating systems to test on (comma-separated: windows,ubuntu)'
        required: false
        default: 'windows,ubuntu'
      gfx_target:
        description: 'AMD GPU targets (comma-separated); Tier 1 runs only for gfx1151'
        required: false
        default: 'gfx1151,gfx1150,gfx120X,gfx110X,gfx103X,gfx90a,gfx908'
      release_tag:
        description: 'Release tag to test (e.g., b1001) or "latest" for the most recent release'
        required: false
        default: 'latest'

env:
  OPERATING_SYSTEMS: ${{ github.event.inputs.operating_systems || 'windows,ubuntu' }}
  GFX_TARGETS: ${{ github.event.inputs.gfx_target || 'gfx1151,gfx1150,gfx120X,gfx110X,gfx103X,gfx90a,gfx908' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'latest' }}

jobs:
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      upstream_sha: ${{ steps.release.outputs.upstream_sha }}
      tier0_matrix: ${{ steps.set-matrix.outputs.tier0_matrix }}
      tier1_matrix: ${{ steps.set-matrix.outputs.tier1_matrix }}
      run_tier1: ${{ steps.set-matrix.outputs.run_tier1 }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Resolves "latest" and reads the llama.cpp commit the release notes name,
    # which T0.9 compares against what the binaries report.
    - name: Resolve the release
      id: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        python3 .github/qualify-rocm/fetch_release_asset.py
        --repo "${{ github.repository }}"
        --tag "$RELEASE_TAG"

    - name: Set matrices
      id: set-matrix
      run: >-
        python3 .github/qualify-rocm/resolve_build_inputs.py
        --gfx-targets "$GFX_TARGETS"
        --operating-systems "$OPERATING_SYSTEMS"
        --skip-pins

  qualify-tier0:
    name: qualify-tier0 (${{ matrix.os }}, ${{ matrix.gfx_target }})
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.tier0_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: llama-${{ needs.prepare-matrix.outputs.release_tag }}-${{ matrix.os }}-rocm-${{ matrix.gfx_target }}-x64.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Download release archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        python .github/qualify-rocm/fetch_release_asset.py
        --repo ${{ github.repository }}
        --tag ${{ needs.prepare-matrix.outputs.release_tag }}
        --asset ${{ env.ASSET }}
        --output-dir artifact

    - name: Run Tier 0 static verification
      run: >-
        python .github/qualify-rocm/tier0_static.py
        --archive artifact/${{ env.ASSET }}
        --os ${{ matrix.os }}
        --gfx-target ${{ matrix.gfx_target }}
        --release-tag ${{ needs.prepare-matrix.outputs.release_tag }}
        --expected-upstream-sha=${{ needs.prepare-matrix.outputs.upstream_sha }}
        --run-binaries
        --fail-on-error
        --output fragments/tier0-${{ matrix.os }}-${{ matrix.gfx_target }}.json

    - name: Upload Tier 0 report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qualify-fragments-tier0-${{ matrix.os }}-${{ matrix.gfx_target }}
        path: fragments/*.json
        if-no-files-found: warn

  qualify-tier1:
    name: qualify-tier1 (${{ matrix.os }}, ${{ matrix.gfx_target }})
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.run_tier1 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.tier1_matrix) }}
    # AMD DevLab's pool: `devlab-dispatch` opts in to the pool and
    # `strix-halo` narrows it to gfx1151 machines; both are required.
    runs-on: [strix-halo, devlab-dispatch, "${{ matrix.runner_os }}", self-hosted]
    timeout-minutes: 60
    env:
      ASSET: llama-${{ needs.prepare-matrix.outputs.release_tag }}-${{ matrix.os }}-rocm-${{ matrix.gfx_target }}-x64.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Pin the interpreter the later steps use. A self-hosted machine may carry a
    # second Python earlier on its search path.
    - name: Pin the interpreter
      shell: python
      run: |
        import os
        location = os.environ["pythonLocation"]
        interpreter = (os.path.join(location, "python.exe") if os.name == "nt"
                       else os.path.join(location, "bin", "python"))
        if not os.path.exists(interpreter):
            raise SystemExit(f"::error::no interpreter at {interpreter}")
        print(f"Qualification scripts will run under {interpreter}")
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
            handle.write(f"QUALIFY_PYTHON={interpreter}\n")

    - name: Download release archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        ${{ env.QUALIFY_PYTHON }} .github/qualify-rocm/fetch_release_asset.py
        --repo ${{ github.repository }}
        --tag ${{ needs.prepare-matrix.outputs.release_tag }}
        --asset ${{ env.ASSET }}
        --output-dir artifact

    - name: Run Tier 1 GPU inference
      run: >-
        ${{ env.QUALIFY_PYTHON }} .github/qualify-rocm/tier1_gpu.py
        --archive artifact/${{ env.ASSET }}
        --gfx-target ${{ matrix.gfx_target }}
        --release-tag ${{ needs.prepare-matrix.outputs.release_tag }}
        --logs-dir fragments
        --fail-on-error
        --output fragments/tier1-${{ matrix.os }}-${{ matrix.gfx_target }}.json

    - name: Upload Tier 1 report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qualify-fragments-tier1-${{ matrix.os }}-${{ matrix.gfx_target }}
        path: |
          fragments/*.json
          fragments/*.log
        if-no-files-found: warn

    - name: Tear down
      if: always()
      continue-on-error: true
      shell: python
      run: |
        import subprocess, sys
        cmd = (["taskkill", "/F", "/IM", "llama-server.exe"]
               if sys.platform == "win32" else
               ["pkill", "-f", "llama-server"])
        try:
            subprocess.run(cmd, check=False, capture_output=True, timeout=60)
        except (OSError, subprocess.SubprocessError) as exc:
            print(f"cleanup skipped: {exc}")
